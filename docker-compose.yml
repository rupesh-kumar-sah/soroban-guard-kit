services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soroban-guard-kit
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_SOROBAN_GUARD_DEMO_MODE=true
      - NEXT_PUBLIC_APP_NAME=Soroban Guard Kit
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped
